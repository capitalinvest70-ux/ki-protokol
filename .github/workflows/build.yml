name: Протоколи КИ – Android + Windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - id: v
        name: Version
        run: |
          V=$(node -p "require('./package.json').version")
          echo "ver=$V" >> $GITHUB_OUTPUT
          echo "VER=$V" >> $GITHUB_ENV
          echo "APKNAME=Protokoli-KI-v$V-build${{ github.run_number }}" >> $GITHUB_ENV
      - name: Fixed signing key (new versions install over the old one)
        run: |
          mkdir -p ~/.android keystore
          if [ ! -f keystore/app.keystore ]; then
            keytool -genkeypair -keystore keystore/app.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git add keystore/app.keystore && git commit -m "Add fixed signing key [skip ci]" && git push
          fi
          cp keystore/app.keystore ~/.android/debug.keystore
      - name: Bundle print + screens
        run: cp ../vendor/mammoth.browser.min.js www/mammoth.js && cat ../vendor/html2canvas.min.js > www/skin.js && printf '\n;\n' >> www/skin.js && cat ../print.js >> www/skin.js && printf '\n;\n' >> www/skin.js && cat ../brand.js >> www/skin.js && printf '\n;\n' >> www/skin.js && cat ../mobile.js >> www/skin.js && printf '\n;\n' >> www/skin.js && cat ../skin.js >> www/skin.js
      - run: npm install
      - run: npx cap add android
      - name: Skin activity, icon, version
        run: |
          D=android/app/src/main/java/bg/capitalinvest/protokol
          mkdir -p $D && cp native/MainActivity.java native/RecService.java $D/
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/ic_$d.png $R/mipmap-$d/ic_launcher.png
            cp icons/ic_$d.png $R/mipmap-$d/ic_launcher_round.png
            cp icons/ic_$d.png $R/mipmap-$d/ic_launcher_foreground.png
          done
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />#' $M
          grep -n BLUETOOTH $M
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.SEND_SMS" />#' $M
          sed -i 's#</application>#    <service android:name=".RecService" android:exported="false" android:foregroundServiceType="microphone" />\n    </application>#' $M
          grep -n "RECORD_AUDIO\|RecService" $M
          grep -q windowSoftInputMode $M || sed -i 's#<activity#<activity android:windowSoftInputMode="adjustResize"#' $M
          grep -n windowSoftInputMode $M
          sed -i 's#android:configChanges="[^"]*"#android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|uiMode|navigation|locale|layoutDirection|fontScale|density|colorMode|touchscreen|mcc|mnc"#' $M
          grep -n configChanges $M
          # Постоянен подпис: всяка версия се подписва с ключа от keystore/app.keystore, за да се инсталира върху старата
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../keystore/app.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          tail -12 android/app/build.gradle
          sed -i 's#</manifest>#    <queries>\n        <intent><action android:name="android.intent.action.SEND" /><data android:mimeType="*/*" /></intent>\n        <intent><action android:name="android.speech.RecognitionService" /></intent>\n        <intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent>\n        <package android:name="com.viber.voip" />\n        <package android:name="com.google.android.gm" />\n        <package android:name="com.microsoft.office.outlook" />\n    </queries>\n</manifest>#' $M
          grep -n -A3 "<queries>" $M
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" $G
      - run: npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk "../$APKNAME.apk"
      - name: Check signing key (must match keystore/app.keystore)
        run: |
          A=$(keytool -printcert -jarfile "../$APKNAME.apk" | grep 'SHA256:' | awk '{print $NF}')
          K=$(keytool -list -v -keystore keystore/app.keystore -storepass android | grep 'SHA256:' | awk '{print $NF}')
          echo "APK: $A"; echo "KEY: $K"
          [ -n "$A" ] && [ "$A" = "$K" ] || { echo "Signing key mismatch"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ env.APKNAME }}.apk

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cp ../skin.js ../print.js ../brand.js ../mobile.js ../vendor/html2canvas.min.js . && cp ../vendor/mammoth.browser.min.js mammoth.js
      - run: npm install
      - name: Build number
        run: |
          echo '{"build": ${{ github.run_number }}}' > build.json
          cat build.json
      - run: npm run dist
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/*.exe

  release:
    needs: [ android, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: protokoli-v${{ needs.android.outputs.ver }}-build${{ github.run_number }}
          name: Протоколи КИ v${{ needs.android.outputs.ver }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            ${{ github.event.head_commit.message }}

            📱 Телефон: свалете файла .apk и го отворете.
            💻 Компютър: свалете Protokoli-KI-Setup-….exe и го отворете – на работния плот се появява „Протоколи КИ“.
          files: out/*
